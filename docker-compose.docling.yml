# Opt-in overlay that adds Docling Serve as a sidecar PDF parser.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.docling.yml up -d
#
# Then in the JustRAG admin Agent panel, set:
#   docling_enabled = true
#   docling_base_url = http://docling:5001
#
# Optional image captioning (charts/figures inside docs + standalone image
# uploads) — also set in the admin Agent panel:
#   docling_picture_description_enabled = true
#   docling_picture_area_threshold      = 0.05   # skip images < 5% of page area
#   docling_picture_description_prompt  = …      # optional; default asks for the
#                                                # document's language + all numbers
# Captioning is performed by this sidecar calling your model API, but the
# endpoint + API key + vision model (describe_image_model) are injected by the Go
# backend from the admin AI provider config — nothing to set on the sidecar. The
# model URL just has to be reachable from this container. What the sidecar DOES
# need is DOCLING_SERVE_ENABLE_REMOTE_SERVICES=true (below): without it docling
# refuses to build the captioning pipeline and every conversion fails over to the
# built-in parsers. The Go worker probes for exactly this at startup and logs an
# error.
#
# Optional formula transcription to LaTeX — admin Agent panel:
#   docling_formula_enrichment_enabled = true
# It needs the docling-project/CodeFormulaV2 model (~611 MB), which the image
# does NOT ship: without it docling fails every document that asks for it. The
# one-shot `docling-models` service below downloads it into its own volume
# once; it never blocks docling from starting (offline → warning, and the
# worker's startup probe logs an error if the flag is on without the model).
#
# The first cold start downloads ~3 GB of models — be patient.

services:
  # Fills the CodeFormulaV2 volume for formula enrichment. The volume is
  # mounted at exactly that model's directory, so the models baked into the
  # image (layout, tables, OCR) stay visible next to it. Skips when the
  # weights are already there; exits 0 even when the download fails.
  docling-models:
    image: quay.io/docling-project/docling-serve:v1.32.0
    # A fresh named volume is root-owned; docling (uid 1001) only reads it.
    user: "0"
    entrypoint:
      - sh
      - -c
      - >-
        D=/opt/app-root/src/.cache/docling/models/docling-project--CodeFormulaV2;
        [ -f "$$D/model.safetensors" ] && exit 0;
        docling-tools models download-hf-repo -q docling-project/CodeFormulaV2
        || echo "WARNING: CodeFormulaV2 download failed; docling_formula_enrichment_enabled will not work";
        exit 0
    volumes:
      - docling-formula-model:/opt/app-root/src/.cache/docling/models/docling-project--CodeFormulaV2
    restart: "no"

  docling:
    # Pinned. `latest` is a moving target: the picture_description_api field this
    # integration sends is deprecated upstream (since 1.21) and may be removed in
    # a later minor, and a silent removal lands as "every PDF falls back to
    # pdftotext". Bump deliberately, then re-run the live integration tests
    # (docs/observability/docling.md):
    #   https://github.com/docling-project/docling-serve/releases
    # GPU variants (docling-serve-cu128 / -cu130) exist only as explicit versions.
    image: quay.io/docling-project/docling-serve:v1.32.0
    container_name: justrag-docling
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      DOCLING_SERVE_ENABLE_UI: "false"
      # Required for image captioning: docling only talks to a remote vision
      # API when this is set explicitly. Harmless when captioning is off.
      DOCLING_SERVE_ENABLE_REMOTE_SERVICES: "true"
      # The Go worker converts through the task endpoints (submit → poll →
      # result), which have no wall-clock cap. This only matters for callers of
      # the synchronous /v1/convert/file (curl, the integration tests' sync
      # fallback), which 504s after this many seconds (upstream default 120).
      DOCLING_SERVE_MAX_SYNC_WAIT: "600"
      # Image captioning config (endpoint + API key + model) is injected
      # per-request by the Go backend from the admin AI provider config — it is
      # NOT set on this sidecar, so the model-API credential never lives here.
      # Docling must still be able to reach that model URL from this container.
    depends_on:
      docling-models:
        condition: service_completed_successfully
    volumes:
      - docling-cache:/.cache
      - docling-formula-model:/opt/app-root/src/.cache/docling/models/docling-project--CodeFormulaV2:ro
    deploy:
      resources:
        limits:
          memory: 8g

  go-server:
    depends_on:
      - docling

  go-worker:
    depends_on:
      - docling

volumes:
  docling-cache:
  docling-formula-model:
