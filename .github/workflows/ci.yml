name: CI

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-backend
    services:
      # pgvector-enabled Postgres backing the `integration`-tagged
      # cascade/vector/kg/tabular/processor tests. Hosts two databases (justrag +
      # justrag_vector, created in the migrate step below) because cmd/migrate
      # deliberately skips the vector migration tree on single-DB setups.
      # Pinned to the same pgvector build and Postgres major as the compose
      # files so CI cannot pass against a different engine than production.
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_USER: justrag
          POSTGRES_PASSWORD: justrag
          POSTGRES_DB: justrag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U justrag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: justrag
      DB_PASSWORD: justrag
      DB_NAME: justrag
      VECTOR_DB_HOST: localhost
      VECTOR_DB_PORT: "5432"
      VECTOR_DB_USER: justrag
      VECTOR_DB_PASSWORD: justrag
      VECTOR_DB_NAME: justrag_vector
      TEST_VECTOR_DSN: postgres://justrag:justrag@localhost:5432/justrag_vector
      # CI-only dummy; config.Load requires >=32 chars even for cmd/migrate.
      JWT_SECRET: ci-only-Jwt-secret-0123456789-abcdef
    steps:
      - uses: actions/checkout@v6
      # v6 is the first node24 release; v5 runs on the deprecated node20.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go-backend/go.mod
          cache-dependency-path: go-backend/go.sum
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        # action v9 runs on node24 (v7/v8 are node20, which GitHub deprecated
        # on the runners) and requires golangci-lint >= v2.1.0 — satisfied by
        # the v2 config schema in go-backend/.golangci.yml.
        uses: golangci/golangci-lint-action@v9
        with:
          # Must stay recent enough for the Go toolchain in go.mod: the linter
          # version pins honnef.co/go/tools, and a staticcheck that predates
          # the toolchain's Go release mis-analyses the stdlib. v2.1.6
          # (staticcheck v0.6.1, Go <=1.24) could not see that testing.T.Fatal
          # terminates under Go 1.26 and emitted bogus SA5011 "possible nil
          # pointer dereference" on every `if x == nil { t.Fatal() }` guard.
          # Bump this together with the go.mod toolchain line.
          version: v2.12.2
          # The prebuilt binary may be compiled with a Go toolchain that
          # refuses go.mod targets newer than it; goinstall builds it with the
          # toolchain from setup-go instead (matches local `go install` setups).
          install-mode: goinstall
          working-directory: go-backend
      - name: govulncheck
        # Pinned like every other tool in this workflow (golangci-lint v2.1.6,
        # the Go toolchain via go.mod). @latest would let an upstream release
        # change CI's pass/fail behaviour without a commit here; bump this line
        # deliberately. The vulnerability DATABASE is still fetched fresh on
        # every run, so pinning the binary does not staleness-freeze findings.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...
      - name: test (race)
        run: go test -race -count=1 ./...
      - name: migrate (integration DBs)
        env:
          PGPASSWORD: justrag
        run: |
          psql -h localhost -U justrag -d justrag -c "CREATE DATABASE justrag_vector OWNER justrag"
          go run ./cmd/migrate
      - name: test (integration, DB-backed)
        run: go test -tags integration -race -count=1 ./internal/cascade/... ./internal/vector/... ./internal/kg/... ./internal/tabular/... ./internal/processor/... ./internal/adminkboverview/... ./internal/adminglobalkbs/... ./internal/kbmembers/... ./internal/kb/... ./internal/authhandler/... ./internal/kbvisibility/... ./internal/kbsubs/... ./internal/agentteams/... ./internal/usage/... ./internal/kbinvites/...
      - name: benchmark smoke
        run: go test -run='^$' -bench=. -benchtime=1x -benchmem ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Action v5 is the first node24 release (v4 runs on the deprecated
      # node20). `node-version` below is the runtime the frontend is BUILT
      # with and is independent of the action's own runtime.
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --workspace=web
      - name: lint
        # BLOCKING since the design-system ESLint rules were armed (card
        # KI-595). It was `continue-on-error: true` with a note about 126
        # pre-existing violations; measured on this branch the tree is at 0
        # errors / 28 warnings, so the advisory flag protected nothing and made
        # the three `design-system/*` rules enforceable only on a developer's
        # own machine.
        #
        # Plain `eslint .` is deliberately the whole gate. It fails on a NEW
        # violation, and it ALSO exits 2 when web/eslint-suppressions.json
        # still lists a hit that no longer exists ("There are suppressions left
        # that do not occur anymore") — that is what makes the 690-entry
        # catalogue a one-way burn-down counter. Do NOT add
        # `--prune-suppressions` here: it repairs the catalogue in place and
        # exits 0, i.e. it removes the very failure this step exists for. The
        # repair belongs to the developer, as `npm run lint:prune --prefix web`,
        # committed together with the migration that shrank the count.
        # `--pass-on-unpruned-suppressions` is set nowhere, on purpose.
        run: cd web && npm run lint
      - name: test
        run: cd web && npm run test
      - name: install chromium for the story suite
        # Only the browser, and only chromium: vitest.config.ts's `storybook`
        # project declares exactly one instance. `--with-deps` pulls the shared
        # libraries the headless browser needs on the runner image.
        run: cd web && npx playwright install --with-deps chromium
      - name: test (stories)
        # ADDED with card KI-780, and the reason is the point of that card.
        # The story suite is the only place a RESPONSIVE assertion can run:
        # jsdom implements neither cascade layers nor media queries, so
        # `npm run test` above cannot tell whether an `lg:` utility actually
        # applies. It did not run in CI at all until now, which is why a
        # stylesheet that disabled every `lg:` rule in the app passed every
        # gate for as long as it did. `ResponsiveCascade.stories.tsx` is the
        # guard; running it here is what makes it one.
        run: cd web && npm run test:stories
      - name: build
        # `npm run build` ends in `node scripts/check-css-cascade.mjs`, which
        # fails the job if any emitted stylesheet contains an unlayered rule
        # that shadows a selector from `@layer utilities` (card KI-780).
        run: cd web && npm run build
      - name: CSP inline-script hash drift
        # A stale 'sha256-…' token in middleware.DefaultCSP silently breaks
        # the SPA bootstrap in CSP-enforcing browsers with no server-side
        # signal; this is the only automated place the drift can surface.
        run: node scripts/check_csp_hash.mjs
