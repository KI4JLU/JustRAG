<!doctype html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <meta name="description" content="JLU RAG - Advanced Knowledge Retrieval System" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="renderer" content="webkit" />

  <!--
    Theme + language BEFORE first paint. Without this the document renders in
    the light default and only flips once React mounts, so every dark-mode user
    gets a white flash on every load. The design system has no
    prefers-color-scheme fallback on purpose: it resolves the preference in JS
    and keys only on [data-theme="dark"] (see the comment above that rule in
    @ki4jlu/design-system/dist/tokens.css), and it assumes exactly this inline
    script — which JustRAG never had.

    The resolution order MIRRORS src/hooks/useThemeAndLanguage.ts: a stored
    'light'/'dark' wins, otherwise prefers-color-scheme; language is a stored
    'de'/'en', otherwise 'de'. If the two ever disagree the page flips again at
    mount — a flicker that is worse than the steady bug — so
    src/indexHtml.theme.test.ts runs this script and the hook against the same
    inputs and compares them.

    Nothing is written to localStorage here; the hook owns persistence.
    The body is try/catch'd because localStorage access throws in some privacy
    modes, and an uncaught exception in <head> would abort the rest of it.

    CSP: this is an INLINE script, so its sha256 has to be in script-src in
    go-backend/internal/middleware/security.go (DefaultCSP). Change one byte
    here without regenerating that hash and CSP-enforcing browsers drop the
    script with no server-side signal — the only symptom is the flash coming
    back, in production only. TestDefaultCSPCoversIndexHTMLInlineScript in
    go-backend/internal/middleware/security_test.go makes that a red test.
  -->
  <script>
    (function () {
      var root = document.documentElement;
      function apply(theme, lang) {
        root.setAttribute('data-theme', theme);
        root.lang = lang;
        var meta = document.querySelector('meta[name="theme-color"]');
        // Mirrors the design system's --color-surface, which src/index.css
        // maps --bg-primary (the body background) onto. The two literals are
        // pinned against the installed package by src/indexHtml.theme.test.ts.
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#121417' : '#f7fafc');
      }
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        var l = localStorage.getItem('language');
        apply(t, l === 'en' || l === 'de' ? l : 'de');
      } catch (e) {
        apply('light', 'de');
      }
    })();
  </script>
  <!-- Design-system type families: Inter (body/UI), Manrope (headings),
       JetBrains Mono (code/labels). Self-hosted: the @font-face sheet is
       imported from src/index.css and Vite fingerprints the woff2 files into
       /assets, which is served immutable. They are deliberately NOT loaded
       from a third-party CDN — the default CSP has no font-src and only
       allows 'self' for stylesheets, so a CDN <link> is blocked outright.
       See web/src/assets/fonts/fonts.css. -->
  <title>JLU RAG</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
