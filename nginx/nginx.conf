events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Optimization
    sendfile        on;
    keepalive_timeout  65;
    gzip  on;

    # Support large file uploads
    client_max_body_size 500M;

    # Docker internal DNS - re-resolves on each request for round-robin across replicas
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Invite-link tokens are credentials (kbinvites.NewToken: permanent, up to
    # admin on a KB) and travel in the path: /join/{token},
    # /api/invites/{token}[/redeem]. The Go server redacts them in its own
    # logs (middleware.redactSecretPath); this does the same for the access
    # log. Matching runs on $uri, the decoded and normalised path, so an
    # encoded or dotted spelling the Go server still routes is caught too;
    # such a request is logged with that normalised path. Every other request
    # keeps nginx's own $request. The referer needs it too: requests made from
    # the /join page carry its full URL. The error log cannot be formatted: an
    # upstream error still records the raw request line there.
    map $uri $log_token_path {
        default "";
        "~^(?<pre>/(?:join|api/invites)/)[^/]+(?<post>/redeem)?$" "${pre}{token}${post}";
    }
    map $log_token_path $log_request {
        "" $request;
        default "$request_method $log_token_path$is_args$args $server_protocol";
    }
    map $http_referer $log_referer {
        default $http_referer;
        "" "-";
        "~^(?<pre>[^?#]*?/+(?:join|api/+invites)/+)[^/?#]+(?<post>.*)$" "${pre}{token}${post}";
    }
    # nginx's predefined "combined" format with the two redacted fields.
    log_format redacted '$remote_addr - $remote_user [$time_local] '
                        '"$log_request" $status $body_bytes_sent '
                        '"$log_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log redacted;

    server {
        listen 80;
        server_name localhost;

        # Go server is the sole backend
        set $upstream http://go-server:3000;

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Health check
        location /health {
            proxy_pass $upstream;
            access_log off;
        }

        # Suppress logs for high-frequency frontend polling (6 requests every ~300ms per open KB)
        location ~ ^/api/kb/[^/]+/(files|chats|rss|confluence-sources|generated-content)$ {
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_buffering off;
            access_log off;
        }
        location = /api/confluence/connections {
            proxy_pass $upstream;
            proxy_http_version 1.1;
            access_log off;
        }

        # Main application
        location / {
            proxy_pass $upstream;

            # WebSocket support (if needed in future)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # SSE streaming support - disable buffering for real-time responses
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }
    }
}
